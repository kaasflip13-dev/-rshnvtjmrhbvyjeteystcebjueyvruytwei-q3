<!DOCTYPE html>
<html lang="nl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>NEON DODGE 3D</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>NEON DODGE 3D</h1>
    <p>Survive the meteor storm!</p>

    <div class="game-container">

        <div class="stats">
            <span>SCORE: <span id="score">0</span></span>
            <span>BEST: <span id="best">0</span></span>
        </div>

        <div class="canvas-wrap">
            <canvas id="game" width="440" height="550"></canvas>
            <div id="overlay" class="overlay hidden">
                <div class="overlay-title">GAME OVER</div>
                <div id="overlayScore" class="overlay-score"></div>
            </div>
        </div>

        <p id="message">Ready to play?</p>

        <button id="startButton" onclick="startGame()">
            START GAME
        </button>

        <p class="controls">
            MOVE: WASD / ARROW KEYS
        </p>

    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="app.js"></script>

</body>
</html>
