
<!DOCTYPE html>
<html lang="nl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>NEON DODGE</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>NEON DODGE</h1>
    <p>Survive the meteor storm!</p>

    <div class="game-container">

        <div class="stats">
            <span>SCORE: <span id="score">0</span></span>
            <span>BEST: <span id="best">0</span></span>
        </div>

        <canvas id="game" width="440" height="550"></canvas>

        <p id="message">Ready to play?</p>

        <button id="startButton" onclick="startGame()">
            START GAME
        </button>

        <p class="controls">
            MOVE: WASD / ARROW KEYS
        </p>

    </div>

    <script src="script.js"></script>

</body>
</html>
