
<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEON DODGE</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #050812;
    color: white;
    font-family: Arial;
    text-align: center;
}

h1 {
    color: #55ff88;
    font-size: 38px;
    text-shadow: 0 0 20px #55ff88;
    margin-bottom: 5px;
}

p {
    color: #aab4c9;
}

.game-container {
    width: 95%;
    max-width: 500px;
    margin: 25px auto;
    padding: 15px;
    background: #101a2c;
    border: 2px solid #254b55;
    border-radius: 15px;
    box-shadow: 0 0 30px #00ff6633;
}

.stats {
    display: flex;
    justify-content: space-around;
    margin: 15px 0;
    font-size: 17px;
    color: #55ff88;
}

canvas {
    display: block;
    width: 100%;
    background: #080d1b;
    border: 2px solid #284b55;
    border-radius: 8px;
}

button {
    background: #55ff88;
    color: #06100a;
    border: none;
    padding: 13px 25px;
    margin: 15px;
    border-radius: 8px;
    font-weight: bold;
    font-size: 16px;
    cursor: pointer;
    transition: 0.2s;
}

button:hover {
    transform: scale(1.08);
    box-shadow: 0 0 20px #55ff88;
}

#message {
    color: #55ff88;
    font-weight: bold;
    min-height: 25px;
}

.controls {
    color: #aab4c9;
    font-size: 13px;
}
</style>
</head>

<body>

<h1>NEON DODGE</h1>
<p>Survive the meteor storm!</p>

<div class="game-container">

    <div class="stats">
        <span>SCORE: <span id="score">0</span></span>
        <span>BEST: <span id="best">0</span></span>
    </div>

    <canvas id="game" width="440" height="550"></canvas>

    <p id="message">Ready to play?</p>

    <button id="startButton" onclick="startGame()">
        START GAME
    </button>

    <p class="controls">
        MOVE: WASD / ARROW KEYS
    </p>

</div>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const scoreText = document.getElementById("score");
const bestText = document.getElementById("best");
const message = document.getElementById("message");
const startButton = document.getElementById("startButton");

let player;
let meteors = [];
let energy = [];
let stars = [];

let score = 0;
let best = Number(localStorage.getItem("neonBest")) || 0;

let running = false;
let animationId = null;
let keys = {};

let meteorTimer = 0;
let energyTimer = 0;
let lastTime = 0;

bestText.textContent = best;

// STARS

for (let i = 0; i < 65; i++) {
    stars.push({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        size: Math.random() * 2 + 1,
        speed: Math.random() * 35 + 15
    });
}

// KEYBOARD

document.addEventListener("keydown", function(e) {
    const key = e.key.toLowerCase();

    if (["arrowup", "arrowdown", "arrowleft", "arrowright", " "].includes(key)) {
        e.preventDefault();
    }

    keys[key] = true;
});

document.addEventListener("keyup", function(e) {
    keys[e.key.toLowerCase()] = false;
});

// PLAYER

function createPlayer() {
    return {
        x: canvas.width / 2,
        y: canvas.height - 65,
        size: 18,
        speed: 270
    };
}

// START GAME

function startGame() {
    cancelAnimationFrame(animationId);

    player = createPlayer();

    meteors = [];
    energy = [];

    score = 0;
    meteorTimer = 0;
    energyTimer = 0;

    lastTime = 0;
    running = true;

    scoreText.textContent = score;
    message.textContent = "SURVIVE!";
    startButton.textContent = "RESTART GAME";

    animationId = requestAnimationFrame(gameLoop);
}

// DRAW BACKGROUND

function drawBackground(dt) {
    ctx.fillStyle = "#080d1b";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    stars.forEach(star => {
        star.y += star.speed * dt;

        if (star.y > canvas.height) {
            star.y = 0;
            star.x = Math.random() * canvas.width;
        }

        ctx.fillStyle = "#7389a5";
        ctx.fillRect(star.x, star.y, star.size, star.size);
    });
}

// DRAW PLAYER

function drawPlayer() {
    ctx.save();

    ctx.shadowBlur = 25;
    ctx.shadowColor = "#55ff88";

    ctx.fillStyle = "#55ff88";
    ctx.beginPath();
    ctx.moveTo(player.x, player.y - 20);
    ctx.lineTo(player.x - 17, player.y + 17);
    ctx.lineTo(player.x, player.y + 10);
    ctx.lineTo(player.x + 17, player.y + 17);
    ctx.closePath();
    ctx.fill();

    ctx.restore();
}

// CREATE METEOR

function createMeteor() {
    meteors.push({
        x: 20 + Math.random() * (canvas.width - 40),
        y: -30,
        size: 12 + Math.random() * 15,
        speed: 150 + Math.random() * 100 + score * 1.5
    });
}

// CREATE ENERGY

function createEnergy() {
    energy.push({
        x: 20 + Math.random() * (canvas.width - 40),
        y: -20,
        size: 9,
        speed: 120
    });
}

// DRAW OBJECTS

function drawMeteor(meteor) {
    ctx.save();

    ctx.shadowBlur = 15;
    ctx.shadowColor = "#ff334f";
    ctx.fillStyle = "#ff405b";

    ctx.beginPath();
    ctx.arc(meteor.x, meteor.y, meteor.size, 0, Math.PI * 2);
    ctx.fill();

    ctx.restore();
}

function drawEnergy(item) {
    ctx.save();

    ctx.shadowBlur = 20;
    ctx.shadowColor = "#55ff88";
    ctx.fillStyle = "#55ff88";

    ctx.beginPath();
    ctx.arc(item.x, item.y, item.size, 0, Math.PI * 2);
    ctx.fill();

    ctx.restore();
}

// COLLISION

function collision(a, b) {
    const dx = a.x - b.x;
    const dy = a.y - b.y;

    return Math.sqrt(dx * dx + dy * dy) < a.size + b.size;
}

// UPDATE GAME

function update(dt) {

    if (keys["arrowleft"] || keys["a"]) {
        player.x -= player.speed * dt;
    }

    if (keys["arrowright"] || keys["d"]) {
        player.x += player.speed * dt;
    }

    if (keys["arrowup"] || keys["w"]) {
        player.y -= player.speed * dt;
    }

    if (keys["arrowdown"] || keys["s"]) {
        player.y += player.speed * dt;
    }

    player.x = Math.max(20, Math.min(canvas.width - 20, player.x));
    player.y = Math.max(25, Math.min(canvas.height - 20, player.y));

    meteorTimer += dt;
    energyTimer += dt;

    if (meteorTimer > Math.max(0.28, 0.85 - score * 0.004)) {
        createMeteor();
        meteorTimer = 0;
    }

    if (energyTimer > 2.5) {
        createEnergy();
        energyTimer = 0;
    }

    meteors.forEach(meteor => {
        meteor.y += meteor.speed * dt;
    });

    energy.forEach(item => {
        item.y += item.speed * dt;
    });

    // METEOR COLLISION

    for (let meteor of meteors) {
        if (collision(player, meteor)) {
            endGame();
            return;
        }
    }

    // COLLECT ENERGY

    energy = energy.filter(item => {
        if (collision(player, item)) {
            score += 10;
            scoreText.textContent = score;
            return false;
        }

        return item.y < canvas.height + 20;
    });

    meteors = meteors.filter(m => m.y < canvas.height + 40);

    // SURVIVAL POINTS

    score += dt * 2;
    scoreText.textContent = Math.floor(score);
}

// GAME LOOP

function gameLoop(timestamp) {
    if (!running) return;

    const dt = lastTime === 0
        ? 0
        : Math.min((timestamp - lastTime) / 1000, 0.04);

    lastTime = timestamp;

    drawBackground(dt);
    update(dt);

    if (!running) return;

    drawEnergyItems();
    drawMeteors();
    drawPlayer();

    animationId = requestAnimationFrame(gameLoop);
}

function drawEnergyItems() {
    energy.forEach(drawEnergy);
}

function drawMeteors() {
    meteors.forEach(drawMeteor);
}

// GAME OVER

function endGame() {
    running = false;

    cancelAnimationFrame(animationId);

    const finalScore = Math.floor(score);

    if (finalScore > best) {
        best = finalScore;
        localStorage.setItem("neonBest", best);
        bestText.textContent = best;
    }

    message.textContent = "GAME OVER! SCORE: " + finalScore;
    startButton.textContent = "PLAY AGAIN";

    ctx.fillStyle = "#000000aa";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.fillStyle = "#ff405b";
    ctx.font = "bold 38px Arial";
    ctx.textAlign = "center";
    ctx.fillText("GAME OVER", canvas.width / 2, 245);

    ctx.fillStyle = "white";
    ctx.font = "20px Arial";
    ctx.fillText("SCORE: " + finalScore, canvas.width / 2, 290);
}

// INITIAL SCREEN

player = createPlayer();
drawBackground(0);
drawPlayer();

</script>

</body>
</html>
